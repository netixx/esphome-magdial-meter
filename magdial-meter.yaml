    unit_of_measurement: µT
    accuracy_decimals: 1
    update_interval: ${debug_update_interval}
    internal: ${hide_debug_sensors}
    lambda: |-
      if (id(magdial_cal_phase) == 1) return id(magdial_cal_samples) ? id(magdial_cal_hi)[1] : NAN;
      return id(magdial_center)[1] + id(magdial_amplitude)[1];
    filters:
