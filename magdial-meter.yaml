---
# Read a meter dial (e.g. a water meter whose magnet turns once per 10 L) by
# tracking the angle of its rotating magnet with a 3-axis magnetometer.
#
# One meter per include: include this file once per meter, each with its own vars
# (id_prefix, name_prefix, i2c_id, driver, ...). The I2C buses are declared by the device
# config. See README.md.
#
# How it works:
#   Each turn of the magnet makes the field vector trace a closed loop. Seen
#   through a pair of axes, normalised by their min/max, the loop goes once
#   around its center per turn, so the angle around the center tracks the dial
#   continuously. Calibration records the loop over at least one full turn and
#   picks the axis pair whose loop stays farthest from its center (best noise
#   margin). The number of times that loop winds around the center proves a full
#   turn was seen, and its sign gives the rotation direction. No assumption is
#   made on the shape of the signal: a magnet close to the sensor gives sharp,
#   far from sinusoidal peaks, which is fine.

defaults:
  # Per meter: prefix of every id (and of the set_total action), e.g. 'cold_'. Must be unique.
  id_prefix: ''
  # Per meter: prefix of every entity name, e.g. 'Cold water '
  name_prefix: ''
  # I2C bus (id declared in the device config) and magnetometer driver: a file name in
  # drivers/ (qmc5883l, qmc5883p, hmc5883l, mmc5603, mlx90393, or none to bring your own)
  i2c_id: i2c_bus
  driver: qmc5883l
  # Override the driver's default I2C address, e.g. 0x18 for recent Adafruit MLX90393 ('' = default)
  i2c_address: ''

  # For water one of: CCF, ft³, gal, L, m³
  volume_unit: 'L'
  device_class: 'water'
  device_icon: 'mdi:water'
  total_accuracy_decimals: '2'
  flow_accuracy_decimals: '2'

  # Sample at least ~10x per turn at the highest flow you expect. The dial must
  # move less than half a turn between two samples or turns are miscounted.
  magnetometer_update_interval: 50ms

  # Initial values of entities editable in Home Assistant (restored on reboot,
  # so changing these only affects a freshly flashed device).
  # Volume of one full turn of the magnet, in volume_unit.
  volume_per_rotation_initial_value: '10'
  # Calibration must cover at least one full turn: at 6 L/min a 10 L dial needs 100 s.
  calibration_seconds_initial_value: '180'
  # Minimum half-amplitude (µT) an axis must swing to be usable. Raw sensor noise is ~1 µT.
  calibration_min_amplitude_initial_value: '10'

  # Publish rate of the debug entities (raw field per axis, dial angle, ...).
  # The algorithm always uses every sample; this only limits Home Assistant traffic.
  debug_update_interval: 2s
  hide_debug_sensors: 'false'

  # Flow is computed from the movement of the dial over this interval.
  flow_update_interval: 10s
  # Dial movement (in turns) below which Flow reads 0, to ignore sensor noise.
  # Smaller movements keep accumulating for up to 10 min, so slow leaks still show.
  flow_deadband_rotations: '0.01'

  # Each complete turn pulls the calibration this fraction toward what was just
  # observed, to follow temperature drift (only when "Adaptive calibration" is on).
  adapt_rate: '0.1'

packages:
  driver: !include drivers/${driver}.yaml

esphome:
  on_boot:
    - priority: -100
      then:
        - script.execute: ${id_prefix}magdial_publish_status

api:
  actions:
    # Make Total match the reading on the physical meter.
    - action: ${id_prefix}set_total
      variables:
        new_total: float
      then:
        - lambda: |-
            id(${id_prefix}magdial_volume_offset) =
                new_total - id(${id_prefix}magdial_rotations_total) * id(${id_prefix}magdial_volume_per_rotation).state;
            id(${id_prefix}magdial_total_published) = new_total;
            id(${id_prefix}magdial_total).publish_state(new_total);

globals:
  # --- Persistent counting state ---
  # Signed number of dial turns since forever (fractional).
  - id: ${id_prefix}magdial_rotations_total
    type: double
    restore_value: true
    initial_value: '0'
  - id: ${id_prefix}magdial_volume_offset
    type: double
    restore_value: true
    initial_value: '0'
  # Volume per rotation the offset was computed with, to keep Total when it changes
  - id: ${id_prefix}magdial_volume_per_rotation_applied
    type: float
    restore_value: true
    initial_value: 'NAN'
  # Highest Total ever published: Total is total_increasing and must never go down.
  - id: ${id_prefix}magdial_total_published
    type: double
    restore_value: true
    initial_value: '0'

  # --- Persistent calibration, per axis x, y, z ---
  - id: ${id_prefix}magdial_center
    type: std::array<float, 3>
    restore_value: true
  - id: ${id_prefix}magdial_amplitude
    type: std::array<float, 3>
    restore_value: true
  # Rotation direction (+1/-1) of each pair x/y, x/z, y/z, from the calibration winding.
  # 0: the pair failed validation and is never used for counting.
  - id: ${id_prefix}magdial_pair_sign
    type: std::array<float, 3>
    restore_value: true
    initial_value: '{{0, 0, 0}}'

  # --- Calibration runtime state ---
  # 0 idle, 1 recording
  - id: ${id_prefix}magdial_cal_phase
    type: int
    initial_value: '0'
  - id: ${id_prefix}magdial_cal_finish
    type: bool
    initial_value: 'false'
  - id: ${id_prefix}magdial_cal_samples
    type: uint32_t
    initial_value: '0'
  - id: ${id_prefix}magdial_cal_lo
    type: std::array<float, 3>
  - id: ${id_prefix}magdial_cal_hi
    type: std::array<float, 3>
  # Trajectory of the field during calibration in 0.1 µT units, at most 400 points
  - id: ${id_prefix}magdial_cal_points
    type: std::vector<std::array<int16_t, 3>>
  # Grows x2 each time the trajectory is thinned
  - id: ${id_prefix}magdial_cal_thin
    type: float
    initial_value: '1'
  # Turns seen by the last successful calibration (diagnostic)
  - id: ${id_prefix}magdial_cal_turns
    type: float
    initial_value: '0'

  # --- Tracking runtime state ---
  # Last two raw samples per axis, for the median-of-3 glitch filter
  - id: ${id_prefix}magdial_median_hist
    type: std::array<std::array<float, 2>, 3>
  - id: ${id_prefix}magdial_median_count
    type: int
    initial_value: '0'
  # Flow computation baseline
  - id: ${id_prefix}magdial_flow_last_rot
    type: double
    initial_value: 'NAN'
  - id: ${id_prefix}magdial_flow_last_ms
    type: uint32_t
    initial_value: '0'
  - id: ${id_prefix}magdial_have_last
    type: bool
    initial_value: 'false'
  # Last raw dial angle in turns, -0.5..0.5
  - id: ${id_prefix}magdial_last_angle
    type: float
    initial_value: '0'
  # Smallest distance of the loop from its center over the last complete turn
  # (1.0 = the amplitude). Noise must stay well below it.
  - id: ${id_prefix}magdial_clearance
    type: float
    initial_value: 'NAN'
  - id: ${id_prefix}magdial_turn_clearance
    type: float
    initial_value: 'NAN'
  # Per-turn extremes for adaptive calibration
  - id: ${id_prefix}magdial_turn_lo
    type: std::array<float, 3>
  - id: ${id_prefix}magdial_turn_hi
    type: std::array<float, 3>
  - id: ${id_prefix}magdial_turn_tracking
    type: bool
    initial_value: 'false'
  - id: ${id_prefix}magdial_last_full_turn
    type: double
    initial_value: '0'

  # --- Learned angle mapping ---
  # Raw angle (0..1, forward) where the dial has done 1/10, 2/10, ... 9/10 of a turn.
  - id: ${id_prefix}magdial_curve
    type: std::array<float, 9>
    restore_value: true
    initial_value: '{{0.1f, 0.2f, 0.3f, 0.4f, 0.5f, 0.6f, 0.7f, 0.8f, 0.9f}}'
  # Complete turns the curve was learned from (capped at 15); used once >= 3
  - id: ${id_prefix}magdial_curve_turns
    type: int
    restore_value: true
    initial_value: '0'
  # Mapping in use, only changed at a turn boundary where Raw and Learned agree
  - id: ${id_prefix}magdial_curve_active
    type: bool
    initial_value: 'false'
  - id: ${id_prefix}magdial_last_raw
    type: float
    initial_value: '0'
  # Current turn: ms since its start when the raw angle first reached j/100
  - id: ${id_prefix}magdial_learn_active
    type: bool
    initial_value: 'false'
  - id: ${id_prefix}magdial_learn_start
    type: uint32_t
    initial_value: '0'
  - id: ${id_prefix}magdial_learn_next
    type: int
    initial_value: '0'
  - id: ${id_prefix}magdial_learn_marks
    type: std::array<uint32_t, 100>
  # Breakpoints of the last 15 complete turns; the curve is their median
  - id: ${id_prefix}magdial_learn_history
    type: std::array<std::array<float, 9>, 15>
  - id: ${id_prefix}magdial_learn_head
    type: int
    initial_value: '0'
  - id: ${id_prefix}magdial_learn_count
    type: int
    initial_value: '0'

number:
  - platform: template
    id: ${id_prefix}magdial_volume_per_rotation
    name: ${name_prefix}Volume per rotation
    entity_category: config
    icon: mdi:rotate-360
    mode: box
    min_value: 0.0001
    max_value: 100000
    step: 0.0001
    initial_value: ${volume_per_rotation_initial_value}
    unit_of_measurement: ${volume_unit}
    restore_value: true
    optimistic: true
    on_value:
      - lambda: |-
          // Keep Total unchanged: the new value only applies to turns from now on.
          const float prev = id(${id_prefix}magdial_volume_per_rotation_applied);
          if (!std::isnan(prev) && prev != x) {
            id(${id_prefix}magdial_volume_offset) += id(${id_prefix}magdial_rotations_total) * (prev - x);
          }
          id(${id_prefix}magdial_volume_per_rotation_applied) = x;

  - platform: template
    id: ${id_prefix}magdial_calibration_time
    name: ${name_prefix}Calibration time
    entity_category: config
    icon: mdi:timer
    mode: box
    min_value: 5
    max_value: 3600
    step: 1
    initial_value: ${calibration_seconds_initial_value}
    unit_of_measurement: s
    restore_value: true
    optimistic: true

  - platform: template
    id: ${id_prefix}magdial_calibration_min_amplitude
    name: ${name_prefix}Calibration minimal amplitude
    entity_category: config
    icon: mdi:sine-wave
    mode: box
    min_value: 0.1
    max_value: 1000
    step: 0.1
    initial_value: ${calibration_min_amplitude_initial_value}
    unit_of_measurement: µT
    restore_value: true
    optimistic: true

select:
  # Set by calibration; can be overridden by hand without recalibrating.
  - platform: template
    id: ${id_prefix}magdial_axis_pair
    name: ${name_prefix}Axis pair
    entity_category: config
    icon: mdi:axis-arrow
    options: [x/y, x/z, y/z, None]
    initial_option: None
    restore_value: true
    optimistic: true
    on_value:
      - lambda: |-
          id(${id_prefix}magdial_have_last) = false;  // angle mapping changed, re-sync
          if (id(${id_prefix}magdial_cal_phase) == 0) id(${id_prefix}magdial_publish_status).execute();

  # Learned: corrected by a curve learned from complete turns, more precise within a turn
  # (falls back to Raw until 3 turns are learned). Raw: angle of the field around its loop
  # center, uneven within a turn when the magnet is close to the sensor. Takes effect at the
  # next turn boundary.
  - platform: template
    id: ${id_prefix}magdial_angle_mapping
    name: ${name_prefix}Angle mapping
    entity_category: config
    icon: mdi:chart-bell-curve-cumulative
    options: [Learned, Raw]
    initial_option: Learned
    restore_value: true
    optimistic: true

switch:
  - platform: template
    id: ${id_prefix}magdial_adaptive
    name: ${name_prefix}Adaptive calibration
    entity_category: config
    icon: mdi:auto-fix
    restore_mode: RESTORE_DEFAULT_ON
    optimistic: true

button:
  - platform: template
    name: ${name_prefix}Calibrate
    entity_category: config
    icon: mdi:tune
    on_press:
      - script.execute: ${id_prefix}magdial_calibrate

  - platform: template
    name: ${name_prefix}Finish calibration now
    entity_category: config
    icon: mdi:check
    on_press:
      - lambda: id(${id_prefix}magdial_cal_finish) = true;

  - platform: template
    name: ${name_prefix}Cancel calibration
    entity_category: config
    icon: mdi:close
    on_press:
      - script.stop: ${id_prefix}magdial_calibrate
      - lambda: |-
          if (id(${id_prefix}magdial_cal_phase) == 0) return;  // nothing running: keep the current status
          id(${id_prefix}magdial_cal_phase) = 0;
          id(${id_prefix}magdial_cal_points).clear();
          id(${id_prefix}magdial_cal_points).shrink_to_fit();
          id(${id_prefix}magdial_have_last) = false;
          ESP_LOGI("${id_prefix}magdial", "Calibration cancelled, previous calibration kept");
          id(${id_prefix}magdial_publish_status).execute();

text_sensor:
  - platform: template
    id: ${id_prefix}magdial_calibration_status
    name: ${name_prefix}Calibration status
    entity_category: diagnostic
    icon: mdi:information-outline
    update_interval: never

  - platform: template
    id: ${id_prefix}magdial_calibration_details
    name: ${name_prefix}Calibration details
    entity_category: diagnostic
    icon: mdi:text-box-outline
    update_interval: never

  # Raw angle (degrees) at each tenth of a turn: evenly spaced (36 72 108 ...) = no correction
  - platform: template
    id: ${id_prefix}magdial_curve_text
    name: ${name_prefix}Learned curve
    entity_category: diagnostic
    icon: mdi:chart-bell-curve-cumulative
    update_interval: never

script:
  - id: ${id_prefix}magdial_publish_status
    then:
      - lambda: |-
          auto pair = id(${id_prefix}magdial_axis_pair).active_index();
          const bool ready = pair.has_value() && *pair < 3 && id(${id_prefix}magdial_pair_sign)[*pair] != 0;
          id(${id_prefix}magdial_calibration_status).publish_state(ready ? "Ready" : "Not calibrated");

  # Called by the driver for every magnetometer sample, after X, Y and Z are published.
  - id: ${id_prefix}magdial_process
    mode: single
    then:
      - lambda: |-
          const float raw[3] = {id(${id_prefix}magnetic_field_x).get_raw_state(), id(${id_prefix}magnetic_field_y).get_raw_state(),
                                id(${id_prefix}magnetic_field_z).get_raw_state()};
          if (std::isnan(raw[0]) || std::isnan(raw[1]) || std::isnan(raw[2])) return;
          // Median of the last 3 samples per axis: a single glitch (e.g. I2C error on a long
          // cable) would otherwise inflate the calibration min/max for good.
          auto &hist = id(${id_prefix}magdial_median_hist);
          int &n_hist = id(${id_prefix}magdial_median_count);
          float v[3];
          for (int i = 0; i < 3; i++) {
            const float a = n_hist >= 2 ? hist[i][0] : raw[i], b = n_hist >= 1 ? hist[i][1] : raw[i], c = raw[i];
            v[i] = std::max(std::min(a, b), std::min(std::max(a, b), c));
            hist[i][0] = hist[i][1];
            hist[i][1] = c;
          }
          if (n_hist < 2) n_hist++;

          // --- Calibration: record the extremes of each axis and the trajectory of the field ---
          if (id(${id_prefix}magdial_cal_phase) == 1) {
            auto &lo = id(${id_prefix}magdial_cal_lo);
            auto &hi = id(${id_prefix}magdial_cal_hi);
            for (int i = 0; i < 3; i++) {
              lo[i] = std::min(lo[i], v[i]);
              hi[i] = std::max(hi[i], v[i]);
            }
            id(${id_prefix}magdial_cal_samples)++;
            // Keep a point each time an axis moved 1 % of its own range (x thin): a few hundred
            // per turn. Axes that barely move (below the minimal amplitude) do not trigger it.
            auto &pts = id(${id_prefix}magdial_cal_points);
            const float min_span = 2.0f * id(${id_prefix}magdial_calibration_min_amplitude).state;
            auto moved = [&](const float *from, const float *to) {
              for (int i = 0; i < 3; i++) {
                const float step = std::max(hi[i] - lo[i], min_span) / 100.0f * id(${id_prefix}magdial_cal_thin);
                if (fabsf(to[i] - from[i]) >= step) return true;
              }
              return false;
            };
            auto unpack = [](const std::array<int16_t, 3> &q, float *out) {
              for (int i = 0; i < 3; i++) out[i] = q[i] * 0.1f;
            };
            if (!pts.empty()) {
              float last[3];
              unpack(pts.back(), last);
              if (!moved(last, v)) return;
            }
            // Full: double the step and re-decimate with it. Consecutive points then stay within
            // one step plus one sample apart (at most 16 % of an amplitude per axis at thin 8),
            // so the winding stays exact for any loop with >= 20 % clearance. Past thin 8 the
            // buffer already holds 10+ turns: finish instead.
            while (pts.size() >= 400 && id(${id_prefix}magdial_cal_thin) < 8) {
              id(${id_prefix}magdial_cal_thin) *= 2;
              size_t k = 1;
              float kept[3], cur[3];
              unpack(pts[0], kept);
              for (size_t j = 1; j < pts.size(); j++) {
                unpack(pts[j], cur);
                if (j + 1 == pts.size() || moved(kept, cur)) {
                  pts[k++] = pts[j];
                  unpack(pts[j], kept);
                }
              }
              pts.resize(k);
            }
            if (pts.size() >= 400) {
              id(${id_prefix}magdial_cal_finish) = true;
              return;
            }
            auto q16 = [](float f) { return (int16_t) std::max(-32768.0f, std::min(32767.0f, roundf(f * 10.0f))); };
            pts.push_back({q16(v[0]), q16(v[1]), q16(v[2])});
            return;
          }

          auto pair = id(${id_prefix}magdial_axis_pair).active_index();
          if (!pair.has_value() || *pair > 2) return;  // not calibrated
          static const int AXES[3][2] = {{0, 1}, {0, 2}, {1, 2}};
          const int p = *pair, a = AXES[p][0], b = AXES[p][1];
          auto &center = id(${id_prefix}magdial_center);
          auto &amp = id(${id_prefix}magdial_amplitude);
          if (amp[a] <= 0 || amp[b] <= 0 || id(${id_prefix}magdial_pair_sign)[p] == 0) return;  // pair not validated

          // --- Raw dial angle: angle of the normalised field around the center of its loop,
          //     oriented to increase with forward flow, 0..1 turn ---
          const float na = (v[a] - center[a]) / amp[a];
          const float nb = (v[b] - center[b]) / amp[b];
          const float radius = sqrtf(na * na + nb * nb);
          float r = id(${id_prefix}magdial_pair_sign)[p] * atan2f(nb, na) / (2.0f * static_cast<float>(M_PI));
          r -= floorf(r);
          const uint32_t now = millis();

          // Learned mapping: section k (k/10..(k+1)/10 of a turn) spans raw angles curve[k-1]..curve[k]
          auto map_angle = [&](float x) {
            if (!id(${id_prefix}magdial_curve_active)) return x;
            const auto &bp = id(${id_prefix}magdial_curve);
            float lo = 0;
            for (int k = 0; k < 10; k++) {
              const float hi = k < 9 ? bp[k] : 1.0f;
              if (x < hi || k == 9) return (k + std::min(1.0f, (x - lo) / std::max(1e-6f, hi - lo))) / 10.0f;
              lo = hi;
            }
            return x;
          };

          if (!id(${id_prefix}magdial_have_last)) {
            id(${id_prefix}magdial_curve_active) =
                id(${id_prefix}magdial_angle_mapping).active_index().value_or(0) == 0 && id(${id_prefix}magdial_curve_turns) >= 3;
            id(${id_prefix}magdial_last_raw) = r;
            id(${id_prefix}magdial_last_angle) = map_angle(r);
            id(${id_prefix}magdial_have_last) = true;
            id(${id_prefix}magdial_learn_active) = false;
            id(${id_prefix}magdial_turn_tracking) = false;
            id(${id_prefix}magdial_turn_clearance) = radius;
            id(${id_prefix}magdial_last_full_turn) = floor(id(${id_prefix}magdial_rotations_total));
            return;
          }
          const float last_r = id(${id_prefix}magdial_last_raw);
          id(${id_prefix}magdial_last_raw) = r;
          float dr = r - last_r;
          if (dr > 0.5f) dr -= 1.0f;
          else if (dr < -0.5f) dr += 1.0f;
          if (fabsf(dr) > 0.3f) {
            ESP_LOGW("${id_prefix}magdial", "Dial moved %.0f° between two samples, turns may be missed: "
                     "lower magnetometer_update_interval", fabsf(dr) * 360.0f);
          }

          // --- Learning: a complete turn goes from one forward crossing of raw angle 0 to the next.
          //     The raw angle where the elapsed time reaches k/10 of the turn is breakpoint k. One
          //     turn mixes flow changes in; they are not tied to the dial position, the curve is,
          //     so the median over the last 15 turns keeps the curve and drops the flow changes. ---
          auto &marks = id(${id_prefix}magdial_learn_marks);
          if (dr < 0 && r > last_r) id(${id_prefix}magdial_learn_active) = false;  // went back across 0: drop the turn
          if (dr > 0 && r < last_r) {
            if (id(${id_prefix}magdial_learn_active)) {
              const uint32_t total = now - id(${id_prefix}magdial_learn_start);
              while (id(${id_prefix}magdial_learn_next) < 100) marks[id(${id_prefix}magdial_learn_next)++] = total;
              std::array<float, 9> turn_bp;
              int j = 0;
              for (int k = 1; k < 10; k++) {
                const float target = total * k / 10.0f;
                while (j < 99 && marks[j + 1] <= target) j++;
                const float t_lo = marks[j], t_hi = j < 99 ? marks[j + 1] : total;
                const float f = t_hi > t_lo ? (target - t_lo) / (t_hi - t_lo) : 0.0f;
                turn_bp[k - 1] = (j + std::max(0.0f, std::min(1.0f, f))) / 100.0f;
              }
              auto &hist = id(${id_prefix}magdial_learn_history);
              hist[id(${id_prefix}magdial_learn_head)] = turn_bp;
              id(${id_prefix}magdial_learn_head) = (id(${id_prefix}magdial_learn_head) + 1) % 15;
              id(${id_prefix}magdial_learn_count) = std::min(id(${id_prefix}magdial_learn_count) + 1, 15);
              id(${id_prefix}magdial_curve_turns) = std::min(id(${id_prefix}magdial_curve_turns) + 1, 15);
              const int n = id(${id_prefix}magdial_learn_count);
              if (n >= 3) {
                // Per breakpoint median; order statistics keep the breakpoints increasing
                std::array<float, 9> curve;
                float col[15];
                for (int k = 0; k < 9; k++) {
                  for (int i = 0; i < n; i++) col[i] = hist[i][k];
                  std::nth_element(col, col + n / 2, col + n);
                  curve[k] = col[n / 2];
                }
                id(${id_prefix}magdial_curve) = curve;
                char text[64];
                int len = 0;
                for (int k = 0; k < 9 && len < (int) sizeof(text); k++)
                  len += snprintf(text + len, sizeof(text) - len, k ? " %.0f" : "%.0f", curve[k] * 360.0f);
                id(${id_prefix}magdial_curve_text).publish_state(text);
              }
            }
            id(${id_prefix}magdial_learn_active) = true;
            id(${id_prefix}magdial_learn_start) = now;
            id(${id_prefix}magdial_learn_next) = 0;
            // Raw and Learned both map raw angle 0 to 0: switching here does not move the count
            id(${id_prefix}magdial_curve_active) =
                id(${id_prefix}magdial_angle_mapping).active_index().value_or(0) == 0 && id(${id_prefix}magdial_curve_turns) >= 3;
            id(${id_prefix}magdial_last_angle) = map_angle(last_r);
          }
          if (id(${id_prefix}magdial_learn_active)) {
            while (id(${id_prefix}magdial_learn_next) < 100 && r * 100.0f >= id(${id_prefix}magdial_learn_next))
              marks[id(${id_prefix}magdial_learn_next)++] = now - id(${id_prefix}magdial_learn_start);
          }

          // --- Count: movement of the (mapped) dial position ---
          const float angle = map_angle(r);
          float d = angle - id(${id_prefix}magdial_last_angle);
          if (d > 0.5f) d -= 1.0f;
          else if (d < -0.5f) d += 1.0f;
          id(${id_prefix}magdial_last_angle) = angle;
          id(${id_prefix}magdial_rotations_total) += d;
          id(${id_prefix}magdial_turn_clearance) = std::min(id(${id_prefix}magdial_turn_clearance), radius);

          // --- Adaptive calibration: after each complete forward turn, nudge toward observed extremes ---
          auto &tlo = id(${id_prefix}magdial_turn_lo);
          auto &thi = id(${id_prefix}magdial_turn_hi);
          for (int i : {a, b}) {
            tlo[i] = std::min(tlo[i], v[i]);
            thi[i] = std::max(thi[i], v[i]);
          }
          const double turn = floor(id(${id_prefix}magdial_rotations_total));
          if (turn > id(${id_prefix}magdial_last_full_turn)) {
            // The first crossing after (re)start ends a partial turn: only start tracking there.
            if (id(${id_prefix}magdial_turn_tracking) && id(${id_prefix}magdial_adaptive).state) {
              bool plausible = true;
              for (int i : {a, b}) {
                const float obs = (thi[i] - tlo[i]) / 2.0f;
                if (obs < 0.7f * amp[i] || obs > 1.3f * amp[i]) plausible = false;
              }
              if (plausible) {
                for (int i : {a, b}) {
                  center[i] += ${adapt_rate} * ((thi[i] + tlo[i]) / 2.0f - center[i]);
                  amp[i] += ${adapt_rate} * ((thi[i] - tlo[i]) / 2.0f - amp[i]);
                }
              } else {
                ESP_LOGD("${id_prefix}magdial", "Turn extremes too far from calibration, not adapting");
              }
            }
            if (id(${id_prefix}magdial_turn_tracking)) id(${id_prefix}magdial_clearance) = id(${id_prefix}magdial_turn_clearance);
            id(${id_prefix}magdial_turn_clearance) = radius;
            id(${id_prefix}magdial_turn_tracking) = true;
            id(${id_prefix}magdial_last_full_turn) = turn;
            for (int i = 0; i < 3; i++) tlo[i] = thi[i] = v[i];
          }

  - id: ${id_prefix}magdial_calibrate
    mode: restart
    then:
      - lambda: |-
          ESP_LOGI("${id_prefix}magdial", "Calibration started: run water for at least one full turn of the dial");
          id(${id_prefix}magdial_cal_lo).fill(std::numeric_limits<float>::max());
          id(${id_prefix}magdial_cal_hi).fill(std::numeric_limits<float>::lowest());
          id(${id_prefix}magdial_cal_samples) = 0;
          id(${id_prefix}magdial_cal_points).clear();
          id(${id_prefix}magdial_cal_points).reserve(400);
          id(${id_prefix}magdial_cal_thin) = 1;
          id(${id_prefix}magdial_cal_finish) = false;
          id(${id_prefix}magdial_cal_phase) = 1;
          id(${id_prefix}magdial_calibration_status).publish_state("Calibrating: run water for at least one full turn");
      - wait_until:
          condition:
            lambda: return id(${id_prefix}magdial_cal_finish);
          timeout: !lambda return id(${id_prefix}magdial_calibration_time).state * 1000;
      - lambda: |-
          id(${id_prefix}magdial_cal_phase) = 0;
          // Moved out so the buffer is freed whatever the outcome
          const std::vector<std::array<int16_t, 3>> pts = std::move(id(${id_prefix}magdial_cal_points));
          id(${id_prefix}magdial_cal_points) = {};
          auto fail = [](const std::string &msg) {
            ESP_LOGE("${id_prefix}magdial", "Calibration failed: %s", msg.c_str());
            id(${id_prefix}magdial_calibration_status).publish_state("Failed: " + msg);
            id(${id_prefix}magdial_have_last) = false;
          };
          if (id(${id_prefix}magdial_cal_samples) < 10) {
            fail("no magnetometer data");
            return;
          }

          const auto &lo = id(${id_prefix}magdial_cal_lo);
          const auto &hi = id(${id_prefix}magdial_cal_hi);
          const char *AXIS = "xyz";
          static const int AXES[3][2] = {{0, 1}, {0, 2}, {1, 2}};
          std::array<float, 3> center, amp;
          for (int i = 0; i < 3; i++) {
            center[i] = (hi[i] + lo[i]) / 2.0f;
            amp[i] = (hi[i] - lo[i]) / 2.0f;
            ESP_LOGI("${id_prefix}magdial", "%c: min %.1f max %.1f amplitude %.1f µT", AXIS[i], lo[i], hi[i], amp[i]);
          }
          ESP_LOGI("${id_prefix}magdial", "%u samples, %u trajectory points%s", (unsigned) id(${id_prefix}magdial_cal_samples),
                   (unsigned) pts.size(), pts.size() >= 400 ? " (buffer full, finished early)" : "");

          // For each pair: how often the normalised loop winds around its center (turns seen,
          // signed by the direction), and how close it comes to the center (noise margin).
          const float min_amp = id(${id_prefix}magdial_calibration_min_amplitude).state;
          std::array<float, 3> winding{}, clearance{};
          int best = -1, usable = 0;
          float best_score = 0;
          for (int p = 0; p < 3; p++) {
            const int a = AXES[p][0], b = AXES[p][1];
            if (amp[a] < min_amp || amp[b] < min_amp) {
              ESP_LOGI("${id_prefix}magdial", "%c/%c: amplitude below %.1f µT", AXIS[a], AXIS[b], min_amp);
              continue;
            }
            usable++;
            float w = 0, clear = 1e9f, last = NAN;
            for (const auto &q : pts) {
              const float na = (q[a] * 0.1f - center[a]) / amp[a], nb = (q[b] * 0.1f - center[b]) / amp[b];
              clear = std::min(clear, sqrtf(na * na + nb * nb));
              const float ang = atan2f(nb, na) / (2.0f * static_cast<float>(M_PI));
              if (!std::isnan(last)) w += ang - last - roundf(ang - last);
              last = ang;
            }
            winding[p] = w;
            clearance[p] = clear;
            // Score: clearance in µT. Axes swinging in phase make a flat loop that passes
            // through its center and cannot be tracked.
            const float score = clear * std::min(amp[a], amp[b]);
            ESP_LOGI("${id_prefix}magdial", "%c/%c: %+.2f turns, clearance %.0f%% (%.1f µT)", AXIS[a], AXIS[b], w,
                     clear * 100.0f, score);
            if (clear >= 0.2f && score >= min_amp / 2.0f && score > best_score) {
              best = p;
              best_score = score;
            }
          }
          if (usable == 0) {
            fail("low signal or no water flowing, fewer than two axes above the minimal amplitude");
            return;
          }
          // Over a partial turn the min/max center means little, so a failed clearance is more
          // likely an incomplete turn than in-phase axes when no pair went fully around.
          float max_turns = 0;
          for (int p = 0; p < 3; p++) max_turns = std::max(max_turns, fabsf(winding[p]));
          if (best < 0 && max_turns >= 0.95f) {
            fail("axes swing in phase, rotate the sensor ~45° on the meter");
            return;
          }
          // Only the best pair decides: a poorer pair can show a bogus winding from noise.
          const float turns = best < 0 ? max_turns : fabsf(winding[best]);
          if (turns < 0.95f) {
            char msg[96];
            snprintf(msg, sizeof(msg), "incomplete turn (%.2f seen), run more water or raise the calibration time",
                     turns);
            fail(msg);
            return;
          }

          // Water flows forward during calibration, so the winding sign is the direction.
          // Pairs that would not pass validation get 0 and are never counted, even if selected by hand.
          std::array<float, 3> sign{};
          for (int p = 0; p < 3; p++) {
            const int a = AXES[p][0], b = AXES[p][1];
            const bool valid = amp[a] >= min_amp && amp[b] >= min_amp && clearance[p] >= 0.2f &&
                               clearance[p] * std::min(amp[a], amp[b]) >= min_amp / 2.0f &&
                               fabsf(winding[p]) >= 0.95f;
            if (valid) sign[p] = winding[p] < 0 ? -1.0f : 1.0f;
          }
          id(${id_prefix}magdial_center) = center;
          id(${id_prefix}magdial_amplitude) = amp;
          id(${id_prefix}magdial_pair_sign) = sign;
          id(${id_prefix}magdial_clearance) = clearance[best];
          id(${id_prefix}magdial_cal_turns) = fabsf(winding[best]);
          // New geometry, new raw angle: learn the curve again
          id(${id_prefix}magdial_curve) = {0.1f, 0.2f, 0.3f, 0.4f, 0.5f, 0.6f, 0.7f, 0.8f, 0.9f};
          id(${id_prefix}magdial_curve_turns) = 0;
          id(${id_prefix}magdial_learn_count) = 0;
          id(${id_prefix}magdial_learn_head) = 0;
          id(${id_prefix}magdial_learn_active) = false;
          id(${id_prefix}magdial_curve_text).publish_state("");

          const int a = AXES[best][0], b = AXES[best][1];
          char details[96];
          snprintf(details, sizeof(details), "%c/%c, %.2f turns, clearance %.0f%% (%.0f µT)", AXIS[a], AXIS[b],
                   fabsf(winding[best]), clearance[best] * 100.0f, best_score);
          ESP_LOGI("${id_prefix}magdial", "Calibration complete: %s", details);
          id(${id_prefix}magdial_axis_pair).make_call().set_index(best).perform();  // also re-syncs the angle
          id(${id_prefix}magdial_have_last) = false;
          id(${id_prefix}magdial_calibration_status).publish_state("Ready");
          id(${id_prefix}magdial_calibration_details).publish_state(details);

sensor:
  - platform: template
    id: ${id_prefix}magdial_total
    name: ${name_prefix}Total
    device_class: ${device_class}
    icon: ${device_icon}
    state_class: total_increasing
    unit_of_measurement: ${volume_unit}
    accuracy_decimals: ${total_accuracy_decimals}
    update_interval: 10s
    lambda: |-
      // Ratchet: sensor noise and back-flow must never make a total_increasing sensor go down.
      const double total =
          id(${id_prefix}magdial_rotations_total) * id(${id_prefix}magdial_volume_per_rotation).state + id(${id_prefix}magdial_volume_offset);
      if (total > id(${id_prefix}magdial_total_published)) id(${id_prefix}magdial_total_published) = total;
      return id(${id_prefix}magdial_total_published);
    filters:
      - or:
          - throttle: 60s
          - delta: 0

  - platform: template
    id: ${id_prefix}magdial_flow
    name: ${name_prefix}Flow
    device_class: volume_flow_rate
    icon: mdi:speedometer
    state_class: measurement
    unit_of_measurement: ${volume_unit}/min
    accuracy_decimals: ${flow_accuracy_decimals}
    update_interval: ${flow_update_interval}
    lambda: |-
      double &last_rot = id(${id_prefix}magdial_flow_last_rot);
      uint32_t &last_ms = id(${id_prefix}magdial_flow_last_ms);
      const uint32_t now = millis();
      const double rot = id(${id_prefix}magdial_rotations_total);
      if (std::isnan(last_rot) || id(${id_prefix}magdial_cal_phase) != 0) {
        last_rot = rot;
        last_ms = now;
        return 0.0f;
      }
      const double moved = rot - last_rot;
      const uint32_t dt = now - last_ms;
      if (moved < ${flow_deadband_rotations}) {
        // Too small to tell from noise. Keep the baseline so a slow leak accumulates
        // until it is measurable, but restart after back-flow or 10 min of nothing.
        if (moved < 0 || dt > 600000) {
          last_rot = rot;
          last_ms = now;
        }
        return 0.0f;
      }
      last_rot = rot;
      last_ms = now;
      return moved * id(${id_prefix}magdial_volume_per_rotation).state * 60000.0 / dt;
    filters:
      - or:
          - throttle: 60s
          - delta: 0

  # --- Debug / diagnostic ---
  - platform: template
    name: ${name_prefix}Rotations total
    entity_category: diagnostic
    icon: mdi:counter
    accuracy_decimals: 3
    update_interval: ${debug_update_interval}
    internal: ${hide_debug_sensors}
    lambda: return id(${id_prefix}magdial_rotations_total);
    filters:
      - delta: 0.001

  - platform: template
    name: ${name_prefix}Dial angle
    entity_category: diagnostic
    icon: mdi:angle-acute
    unit_of_measurement: °
    accuracy_decimals: 0
    update_interval: ${debug_update_interval}
    internal: ${hide_debug_sensors}
    lambda: |-
      const double r = id(${id_prefix}magdial_rotations_total);
      return (r - floor(r)) * 360.0;
    filters:
      - delta: 1

  - platform: template
    name: ${name_prefix}Curve learned turns
    entity_category: diagnostic
    icon: mdi:school
    accuracy_decimals: 0
    update_interval: ${debug_update_interval}
    internal: ${hide_debug_sensors}
    lambda: return id(${id_prefix}magdial_curve_turns);
    filters:
      - delta: 1

  # Closest approach of the loop to its center over the last turn, in % of the amplitude.
  # Falling toward 0 means the field changed (sensor moved, drift): recalibrate.
  - platform: template
    name: ${name_prefix}Signal clearance
    entity_category: diagnostic
    icon: mdi:signal
    unit_of_measurement: '%'
    accuracy_decimals: 0
    update_interval: ${debug_update_interval}
    internal: ${hide_debug_sensors}
    lambda: return id(${id_prefix}magdial_clearance) * 100.0f;
    filters:
      - delta: 1

  # Extremes per axis: live while calibrating, calibrated (and adapted) values otherwise.
  - platform: template
    name: ${name_prefix}Magnetic field X min
    entity_category: diagnostic
    icon: mdi:arrow-collapse-down
    unit_of_measurement: µT
    accuracy_decimals: 1
    update_interval: ${debug_update_interval}
    internal: ${hide_debug_sensors}
    lambda: |-
      if (id(${id_prefix}magdial_cal_phase) == 1) return id(${id_prefix}magdial_cal_samples) ? id(${id_prefix}magdial_cal_lo)[0] : NAN;
      return id(${id_prefix}magdial_center)[0] - id(${id_prefix}magdial_amplitude)[0];
    filters:
      - delta: 0.1
  - platform: template
    name: ${name_prefix}Magnetic field X max
    entity_category: diagnostic
    icon: mdi:arrow-collapse-up
    unit_of_measurement: µT
    accuracy_decimals: 1
    update_interval: ${debug_update_interval}
    internal: ${hide_debug_sensors}
    lambda: |-
      if (id(${id_prefix}magdial_cal_phase) == 1) return id(${id_prefix}magdial_cal_samples) ? id(${id_prefix}magdial_cal_hi)[0] : NAN;
      return id(${id_prefix}magdial_center)[0] + id(${id_prefix}magdial_amplitude)[0];
    filters:
      - delta: 0.1
  - platform: template
    name: ${name_prefix}Magnetic field Y min
    entity_category: diagnostic
    icon: mdi:arrow-collapse-down
    unit_of_measurement: µT
    accuracy_decimals: 1
    update_interval: ${debug_update_interval}
    internal: ${hide_debug_sensors}
    lambda: |-
      if (id(${id_prefix}magdial_cal_phase) == 1) return id(${id_prefix}magdial_cal_samples) ? id(${id_prefix}magdial_cal_lo)[1] : NAN;
      return id(${id_prefix}magdial_center)[1] - id(${id_prefix}magdial_amplitude)[1];
    filters:
      - delta: 0.1
  - platform: template
    name: ${name_prefix}Magnetic field Y max
    entity_category: diagnostic
    icon: mdi:arrow-collapse-up
    unit_of_measurement: µT
    accuracy_decimals: 1
    update_interval: ${debug_update_interval}
    internal: ${hide_debug_sensors}
    lambda: |-
      if (id(${id_prefix}magdial_cal_phase) == 1) return id(${id_prefix}magdial_cal_samples) ? id(${id_prefix}magdial_cal_hi)[1] : NAN;
      return id(${id_prefix}magdial_center)[1] + id(${id_prefix}magdial_amplitude)[1];
    filters:
      - delta: 0.1
  - platform: template
    name: ${name_prefix}Magnetic field Z min
    entity_category: diagnostic
    icon: mdi:arrow-collapse-down
    unit_of_measurement: µT
    accuracy_decimals: 1
    update_interval: ${debug_update_interval}
    internal: ${hide_debug_sensors}
    lambda: |-
      if (id(${id_prefix}magdial_cal_phase) == 1) return id(${id_prefix}magdial_cal_samples) ? id(${id_prefix}magdial_cal_lo)[2] : NAN;
      return id(${id_prefix}magdial_center)[2] - id(${id_prefix}magdial_amplitude)[2];
    filters:
      - delta: 0.1
  - platform: template
    name: ${name_prefix}Magnetic field Z max
    entity_category: diagnostic
    icon: mdi:arrow-collapse-up
    unit_of_measurement: µT
    accuracy_decimals: 1
    update_interval: ${debug_update_interval}
    internal: ${hide_debug_sensors}
    lambda: |-
      if (id(${id_prefix}magdial_cal_phase) == 1) return id(${id_prefix}magdial_cal_samples) ? id(${id_prefix}magdial_cal_hi)[2] : NAN;
      return id(${id_prefix}magdial_center)[2] + id(${id_prefix}magdial_amplitude)[2];
    filters:
      - delta: 0.1
