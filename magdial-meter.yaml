    icon: mdi:arrow-collapse-down
    unit_of_measurement: µT
    accuracy_decimals: 1
    update_interval: ${debug_update_interval}
    internal: ${hide_debug_sensors}
    lambda: |-
      if (id(magdial_cal_phase) == 1) return id(magdial_cal_samples) ? id(magdial_cal_lo)[2] : NAN;
      return id(magdial_center)[2] - id(magdial_amplitude)[2];
    filters:
