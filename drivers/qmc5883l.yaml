---
# QMC5883L, native ESPHome driver. https://esphome.io/components/sensor/qmc5883l/
# Fixed address 0x0D: one per bus (use another bus or a TCA9548A for more).
# 800µT range: a magnet close to the sensor easily exceeds 200µT (saturated readings corrupt calibration).
# Included by magdial-meter.yaml (driver: qmc5883l), with that meter's vars.
sensor:
  - platform: qmc5883l
    id: ${id_prefix}magnetometer
    i2c_id: ${i2c_id}
    address: ${i2c_address or '0x0D'}
    update_interval: ${magnetometer_update_interval}
    oversampling: 512x
    range: 800µT
    field_strength_x:
      id: ${id_prefix}magnetic_field_x
      name: ${name_prefix}Magnetic field X
      entity_category: diagnostic
      internal: ${hide_debug_sensors}
      filters:
        - throttle_average: ${debug_update_interval}
    field_strength_y:
      id: ${id_prefix}magnetic_field_y
      name: ${name_prefix}Magnetic field Y
      entity_category: diagnostic
      internal: ${hide_debug_sensors}
      filters:
        - throttle_average: ${debug_update_interval}
    field_strength_z:
      id: ${id_prefix}magnetic_field_z
      name: ${name_prefix}Magnetic field Z
      entity_category: diagnostic
      internal: ${hide_debug_sensors}
      filters:
        - throttle_average: ${debug_update_interval}
      # Drivers publish X, Y, then Z: by now all three axes hold this sample.
      on_raw_value:
        - script.execute: ${id_prefix}magdial_process
