---
# HMC5883L, native ESPHome driver. https://esphome.io/components/sensor/hmc5883l/
logger:
  logs:
    hmc5883l: INFO

sensor:
  - platform: hmc5883l
    id: magnetometer
    i2c_id: magdial_i2c
    update_interval: ${magnetometer_update_interval}
    address: 0x1E
    oversampling: 8x
    field_strength_x:
      id: magnetic_field_x
      name: Magnetic field X
      entity_category: diagnostic
      internal: ${hide_debug_sensors}
      filters:
        - throttle_average: ${debug_update_interval}
    field_strength_y:
      id: magnetic_field_y
      name: Magnetic field Y
      entity_category: diagnostic
      internal: ${hide_debug_sensors}
      filters:
        - throttle_average: ${debug_update_interval}
    field_strength_z:
      id: magnetic_field_z
      name: Magnetic field Z
      entity_category: diagnostic
      internal: ${hide_debug_sensors}
      filters:
        - throttle_average: ${debug_update_interval}
      # Drivers publish X, Y, then Z: by now all three axes hold this sample.
      on_raw_value:
        - script.execute: magdial_process
