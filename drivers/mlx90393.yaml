---
# MLX90393, native ESPHome driver. https://esphome.io/components/sensor/mlx90393/
# Factory address is 0x0C. Adafruit STEMMA QT breakouts sold since May 2023 use 0x18: set the
# meter var i2c_address: '0x18'. Other addresses are selectable with the A0/A1 pins.
# Included by magdial-meter.yaml (driver: mlx90393), with that meter's vars.
sensor:
  - platform: mlx90393
    id: ${id_prefix}magnetometer
    i2c_id: ${i2c_id}
    address: ${i2c_address or '0x0C'}
    update_interval: ${magnetometer_update_interval}
    oversampling: 1
    filter: 5
    x_axis:
      id: ${id_prefix}magnetic_field_x
      name: ${name_prefix}Magnetic field X
      entity_category: diagnostic
      internal: ${hide_debug_sensors}
      filters:
        - throttle_average: ${debug_update_interval}
    y_axis:
      id: ${id_prefix}magnetic_field_y
      name: ${name_prefix}Magnetic field Y
      entity_category: diagnostic
      internal: ${hide_debug_sensors}
      filters:
        - throttle_average: ${debug_update_interval}
    z_axis:
      id: ${id_prefix}magnetic_field_z
      name: ${name_prefix}Magnetic field Z
      entity_category: diagnostic
      internal: ${hide_debug_sensors}
      filters:
        - throttle_average: ${debug_update_interval}
      # Drivers publish X, Y, then Z: by now all three axes hold this sample.
      on_raw_value:
        - script.execute: ${id_prefix}magdial_process
