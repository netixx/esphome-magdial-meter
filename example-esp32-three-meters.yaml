---
# Example device: three meters on one ESP32.
#  - cold and hot water: identical QMC5883P boards (fixed address 0x2C), one per hardware bus
#  - garden: a QMC5883L (0x0D) sharing the first bus, 1 L per turn
# Identical chips beyond two: use a TCA9548A multiplexer instead, see README.md.
i2c:
  - id: i2c_bus
    sda: GPIO13
    scl: GPIO16
    frequency: 100kHz
  - id: i2c_bus_2
    sda: GPIO14
    scl: GPIO15
    frequency: 100kHz

packages:
  meters:
    url: https://github.com/netixx/esphome-magdial-meter
    ref: main
    files:
      - path: magdial-meter.yaml
        vars: {id_prefix: cold_, name_prefix: 'Cold water ', driver: qmc5883p, i2c_id: i2c_bus}
      - path: magdial-meter.yaml
        vars: {id_prefix: hot_, name_prefix: 'Hot water ', driver: qmc5883p, i2c_id: i2c_bus_2}
      - path: magdial-meter.yaml
        vars: {id_prefix: garden_, name_prefix: 'Garden ', driver: qmc5883l, i2c_id: i2c_bus,
               volume_per_rotation_initial_value: '1'}
    refresh: 1d

esphome:
  name: water-meters
  friendly_name: Water meters

esp32:
  board: esp32dev
  framework:
    type: esp-idf

preferences:
  flash_write_interval: 5min

logger:
  level: DEBUG
  logs:
    qmc5883p: INFO
    qmc5883l: INFO

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
