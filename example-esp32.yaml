---
# Example device: ESP32 + QMC5883P on a 10 L/turn water meter.
# Keep your own esphome:, esp32:, network (wifi: or ethernet:), api: and ota: blocks.
substitutions:
  volume_unit: 'L'
  volume_per_rotation_initial_value: '10'
  i2c_sda: GPIO13
  i2c_scl: GPIO16
  i2c_frequency: 100kHz

packages:
  meter:
    url: https://github.com/netixx/esphome-magdial-meter
    ref: main
    files: [magdial-meter.yaml, drivers/qmc5883p.yaml]
    refresh: 1d

esphome:
  name: water-meter
  friendly_name: Water meter

esp32:
  board: esp32dev
  framework:
    type: esp-idf

preferences:
  # Counter and calibration are saved to flash at most this often
  flash_write_interval: 5min

logger:
  level: DEBUG
  logs:
    # The driver logs every sample (20 per second) at DEBUG
    qmc5883p: INFO

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
