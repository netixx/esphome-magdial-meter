---
name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install ESPHome and yamllint
        run: pip install esphome yamllint

      - name: Lint YAML
        run: yamllint .

      - name: Validate every driver config
        run: esphome config tests/test-*.yaml

      # Compile the meter logic for the host and run it against a simulated
      # magnet; each simulation exits non-zero if its expectation is not met.
      - name: Simulation, full run
        run: |
          esphome compile tests/sim-host.yaml
          cd tests && ./.esphome/build/magdial-sim/.pioenvs/magdial-sim/program

      - name: Simulation, calibration over a partial turn must fail
        run: |
          esphome compile tests/sim-partial-turn.yaml
          cd tests && ./.esphome/build/magdial-sim-partial/.pioenvs/magdial-sim-partial/program

      - name: Simulation, long calibration must finish early and count correctly
        run: |
          esphome compile tests/sim-long-calibration.yaml
          cd tests && ./.esphome/build/magdial-sim-long/.pioenvs/magdial-sim-long/program

      - name: Replay real data, calibration and counting
        run: |
          esphome compile tests/replay-real-log.yaml
          cd tests && ./.esphome/build/magdial-replay/.pioenvs/magdial-replay/program

      - name: Replay real data, calibration over less than a turn must fail
        run: |
          esphome compile tests/replay-real-log-short.yaml
          cd tests && ./.esphome/build/magdial-replay-short/.pioenvs/magdial-replay-short/program

      - name: Simulation, learned angle mapping under random flow
        run: |
          esphome compile tests/sim-learned-curve.yaml
          cd tests && ./.esphome/build/magdial-sim-learned/.pioenvs/magdial-sim-learned/program
